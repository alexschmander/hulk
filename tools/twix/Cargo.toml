[package]
name = "twix"
version = "0.22.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true

[dependencies]
ball_filter = { workspace = true }
behavior_node = { workspace = true }
bevy = { workspace = true, features = ["3d_bevy_render"] }
clap = { workspace = true }
color-eyre = { workspace = true }
convert_case = { workspace = true }
coordinate_systems = { workspace = true }
dirs = { workspace = true }
eframe = { workspace = true }
egui_bevy = { workspace = true }
egui_extras = { workspace = true }
egui_material_icons = { workspace = true }
egui_plot = { workspace = true }
egui_tiles = { workspace = true }
geometry = { workspace = true }
hulk_widgets = { workspace = true }
image = { workspace = true }
kinematics = { workspace = true }
linear_algebra = { workspace = true }
log = { workspace = true }
nalgebra = { workspace = true }
projection = { workspace = true }
repository = { workspace = true }
rhai = { workspace = true }
robot_logs = { workspace = true }
ros-z = { workspace = true }
ros-z-debug = { workspace = true }
ros-z-protocol = { workspace = true }
ros2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
simulate = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
twix_visualization = { workspace = true }
types = { workspace = true }
uuid = { workspace = true }
zenoh = { workspace = true }

[features]
simulator = ["dep:simulate", "dep:tikv-jemallocator"]

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }
